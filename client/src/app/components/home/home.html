<app-navbar
  [activeTab]="activeTab()"
  [selectedCategory]="selectedCategory()"
  [searchQuery]="searchQuery"
  [username]="username()"
  [userInitial]="userInitial()"
  [showProfileMenu]="showProfileMenu()"
  [categories]="categories"
  [filters]="filters()"
  (tabChange)="switchTab($event)"
  (search)="onSearch()"
  (searchQueryChange)="onSearchQueryChange($event)"
  (toggleProfile)="toggleProfileMenu()"
  (closeProfile)="closeProfileMenu()"
  (logout)="logout()"
  (categorySelect)="selectCategory($event)"
  (filtersChange)="onFiltersChange($event)" />

<main class="pb-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto" [class]="activeTab() === 'categorias' ? 'pt-44 sm:pt-36' : 'pt-32 sm:pt-28'">


  @if (isSearching() && searchQuery.trim()) {
    <div class="mb-6">
      <p class="text-sm text-[rgba(210,180,180,0.7)]">
        Resultados para <span class="text-[#f1e8e8] font-semibold">"{{ searchQuery }}"</span>
      </p>
    </div>
  }


  @if (selectedCategory()) {
    <div class="mb-6">
      <p class="text-sm text-[rgba(210,180,180,0.7)]">
        Categoria: <span class="text-[#f1e8e8] font-semibold">{{ selectedCategory() }}</span>
      </p>
    </div>
  }

  @if (!isSearching() && !selectedCategory() && activeTab() !== 'todos') {
    <div class="mb-6">
      <p class="text-sm text-[rgba(210,180,180,0.7)]">
        {{ activeTab() === 'ovas' ? 'OVAs' : 'Filmes' }}
      </p>
    </div>
  }

  <app-anime-grid
    [animes]="animes()"
    [isLoading]="isLoading()"
    [errorMessage]="errorMessage()"
    [hasNextPage]="hasNextPage()"
    [favoriteIds]="favoriteIds()"
    (loadMore)="loadMore()"
    (retry)="loadAnimes()"
    (toggleFavorite)="toggleFavorite($event)"
    (openDetails)="openDetails($event)" />
</main>

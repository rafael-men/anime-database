<nav class="fixed top-0 left-0 right-0 z-50 bg-black/90 backdrop-blur-xl border-b border-white/[0.06]">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16 gap-4">

      <!-- Logo -->
      <div class="flex items-center gap-3 cursor-pointer shrink-0" (click)="tabChange.emit('todos')">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-[#a82020] to-[#8b1a1a] flex items-center justify-center shadow-lg shadow-red-900/20">
          <span class="material-symbols-outlined text-white text-xl">play_circle</span>
        </div>
        <span class="text-xl font-bold text-[#f0f0f0] tracking-tight hidden sm:block">
          Ani<span class="text-[#c02828]">DB</span>
        </span>
      </div>

      <!-- Desktop Nav Links -->
      <div class="hidden md:flex items-center shrink-0">
        <button
          (click)="tabChange.emit('categorias')"
          class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200"
          [class]="activeTab() === 'categorias'
            ? 'bg-white/[0.08] text-[#f0f0f0]'
            : 'text-[rgba(200,200,200,0.65)] hover:text-[#f0f0f0] hover:bg-white/[0.05]'">
          Explorar
        </button>
      </div>

      <!-- Right Section -->
      <div class="flex items-center gap-3 flex-1 justify-end min-w-0">

        <!-- Search -->
        <div class="flex-1 min-w-0 sm:flex-none sm:w-80 sm:shrink-0">
          <div class="flex items-center bg-white/[0.05] border border-white/[0.08] rounded-full px-4 py-2 focus-within:border-white/[0.18] focus-within:bg-white/[0.07] focus-within:shadow-[0_0_0_3px_rgba(255,255,255,0.04)] transition-all duration-200">
            <span class="material-symbols-outlined text-[rgba(200,200,200,0.4)] text-lg mr-2 shrink-0">search</span>
            <input
              type="text"
              [(ngModel)]="localQuery"
              (ngModelChange)="onSearchInput()"
              (keyup.enter)="onSearch()"
              placeholder="Pesquisar..."
              class="bg-transparent border-none outline-none text-[#f0f0f0] text-sm w-full min-w-0 placeholder-[rgba(200,200,200,0.35)]" />
            @if (localQuery) {
              <button
                (click)="onClear()"
                class="ml-1 shrink-0 text-[rgba(200,200,200,0.45)] hover:text-[#f0f0f0] transition-colors bg-transparent border-none cursor-pointer p-0">
                <span class="material-symbols-outlined text-lg">close</span>
              </button>
            }
          </div>
        </div>

        <!-- Profile -->
        <div class="relative shrink-0">
          <button
            (click)="toggleProfile.emit()"
            class="w-9 h-9 rounded-full bg-gradient-to-br from-[#a82020] to-[#8b1a1a] flex items-center justify-center text-white text-sm font-bold ring-2 ring-white/[0.1] hover:ring-white/[0.2] transition-all duration-200 shadow-lg shadow-red-900/20 border-none cursor-pointer p-0">
            {{ userInitial() }}
          </button>

          <app-profile-menu
            [username]="username()"
            [userInitial]="userInitial()"
            [isOpen]="showProfileMenu()"
            (logout)="logout.emit()"
            (close)="closeProfile.emit()" />
        </div>

        <!-- Mobile Menu Button -->
        <button
          (click)="activeTab() === 'todos' ? tabChange.emit('categorias') : tabChange.emit('todos')"
          class="md:hidden shrink-0 text-[rgba(200,200,200,0.65)] hover:text-[#f0f0f0] transition-colors bg-transparent border-none cursor-pointer p-1">
          <span class="material-symbols-outlined text-xl">{{ activeTab() === 'todos' ? 'explore' : 'home' }}</span>
        </button>
      </div>
    </div>

    <!-- Category Bar -->
    @if (activeTab() === 'categorias') {
      <div class="pb-2.5">
        <app-category-chips
          [categories]="categories()"
          [selectedCategory]="selectedCategory()"
          (categorySelect)="categorySelect.emit($event)" />
      </div>
    }
  </div>
</nav>

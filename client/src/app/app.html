<main class="min-h-screen bg-slate-950 text-slate-100">
   <section class="mx-auto flex min-h-screen w-full max-w-6xl flex-col justify-center px-6 py-16">
      <p
         class="mb-4 inline-flex w-fit rounded-full border border-cyan-400/40 bg-cyan-400/10 px-3 py-1 text-xs font-medium tracking-[0.18em] text-cyan-200 uppercase">
         Tailwind Configurado
      </p>

      <h1 class="max-w-3xl text-4xl leading-tight font-semibold text-balance sm:text-5xl lg:text-6xl">
         {{ title }}
      </h1>

      <p class="mt-6 max-w-2xl text-base text-slate-300 sm:text-lg">
         Base do frontend limpa e pronta para evoluir com componentes, rotas e integracao com a API.
      </p>

      <div class="mt-10 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
         <article class="rounded-2xl border border-slate-800 bg-slate-900/70 p-5">
            <h2 class="text-sm font-semibold tracking-wide text-cyan-200 uppercase">Stack</h2>
            <p class="mt-2 text-slate-300">Angular 21 + Tailwind 4</p>
         </article>

         <article class="rounded-2xl border border-slate-800 bg-slate-900/70 p-5">
            <h2 class="text-sm font-semibold tracking-wide text-cyan-200 uppercase">Objetivo</h2>
            <p class="mt-2 text-slate-300">Listagem, filtros e favoritos de animes</p>
         </article>

         <article class="rounded-2xl border border-slate-800 bg-slate-900/70 p-5">
            <h2 class="text-sm font-semibold tracking-wide text-cyan-200 uppercase">Proximo passo</h2>
            <p class="mt-2 text-slate-300">Criar layout da home com busca e cards</p>
         </article>
      </div>
   </section>
</main>
